name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ai-studio-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npx vitest run --reporter=dot

      - name: Build
        run: npm run build

      - name: Static release verification
        run: npm run verify:static

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Browser regression and PWA offline tests
        run: |
          npx playwright test
          npm run test:pwa

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-debug
          path: |
            test-results/
            .local-evidence/
          if-no-files-found: ignore
          retention-days: 7
